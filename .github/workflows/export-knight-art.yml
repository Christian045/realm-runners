name: Export knight art for frame normalization
on:
  push:
    branches: [fix/knight-complete-frames-v045]
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: knight-v044-source
          path: assets/knight/v044/*.png
          retention-days: 1
