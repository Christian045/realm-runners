name: Test Dungeon Reborn
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser smoke tests
        run: |
          python3 -m http.server 8000 &
          sleep 2
          node tests/mage-production-browser.cjs
          node tests/knight-production-browser.cjs
          node tests/painted-knight-browser.cjs
          node tests/knight-painted-050-browser.cjs
          node tests/knight-north-051-browser.cjs
          node tests/knight-north-052-browser.cjs
          node tests/knight-side-053-browser.cjs
          node tests/knight-atlas-isolation-browser.cjs
          node tests/rig-browser.cjs
          node tests/animation-lab-browser.cjs
          npm run test:model-continuity-browser
          npm run test:robed-idle-browser
          npm run test:browser
          npm run test:knight-browser
          npm run test:knight-actions-browser
          npm run test:heroes-browser
          npm run test:locomotion-browser
          npm run test:companions-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animation-browser-screenshots
          path: test-output/*.png
          retention-days: 7
