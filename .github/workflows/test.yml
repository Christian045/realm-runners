name: Realm Runners checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: realm-runners-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Syntax and regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: node --check game.js && node --check rpg.js && node --check boss.js && node --check enemies.js && node --check level_design.js && node --check course_features.js && node --check world_map.js && node --check castle_art.js && node --check hd_background.js && node --check forest.js && node --check changelog.js
      - run: npm test

  browsers:
    name: Browser smoke (Chromium + WebKit)
    needs: regression
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --shm-size=1gb
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Run browser smoke tests
        timeout-minutes: 4
        run: |
          python3 -m http.server 8000 > /tmp/realm-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/realm-server.log; exit 1; fi
          npm run test:browser
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realm-runners-browser-previews
          path: test-output/
          if-no-files-found: ignore
