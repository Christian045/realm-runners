<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101a33"><title>Realm Runners · Emerald Forest</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1630;font-family:system-ui,sans-serif;color:#fff;touch-action:none}canvas{display:block;width:100vw;height:100dvh}.hud{position:fixed;inset:10px 12px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-weight:800;text-shadow:0 2px 4px #112}.pill{background:#152950cb;border:1px solid #5577a5a0;padding:8px 11px;border-radius:12px;font-size:clamp(11px,2.7vw,15px)}.controls{position:fixed;inset:auto 14px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;pointer-events:none}.group{display:flex;gap:12px}.controls button{width:clamp(60px,14vw,80px);height:clamp(60px,14vw,80px);border:2px solid #9ec5f6a0;border-radius:24px;background:#234d91a9;color:#fff;font-weight:900;font-size:25px;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}.controls button.jump{background:#5a469cbf}.controls button.skill{background:#8d597fbf}.layer{position:fixed;inset:0;background:#08152ce8;display:grid;place-items:center;padding:15px;overflow-y:auto}.panel{width:min(580px,100%);padding:20px;border:1px solid #6e9cc5;border-radius:24px;background:linear-gradient(145deg,#2d4879,#132448);box-shadow:0 20px 80px #0009;text-align:center}.panel h1{margin:5px 0 8px;font-size:clamp(25px,6vw,39px);letter-spacing:.5px}.panel p{color:#c8d8f5;line-height:1.45;font-size:14px}.choices,.levels{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:16px auto}.choices button,.levels button,.primary,.secondary{border:1px solid #8eadde;border-radius:12px;color:white;background:#284d89;padding:12px 15px;font-size:14px;font-weight:800;cursor:pointer}.choices button.active,.levels button.active,.primary{background:#5184eb;border-color:#a2c3ff}.levels button:disabled{opacity:.38;cursor:not-allowed}.row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.secondary{background:#37415e}.tip{font-size:12px!important;opacity:.85}.hide{display:none!important}@media(min-width:950px){.controls{opacity:.6}}
</style></head><body><canvas id="view"></canvas><div id="hud" class="hud hide"><div class="pill" id="hudLeft"></div><div class="pill" id="hudRight"></div></div><div class="controls hide" id="controls"><div class="group"><button data-control="left" aria-label="Links">◀</button><button data-control="right" aria-label="Rechts">▶</button></div><div class="group"><button class="skill" data-control="dash" aria-label="Fähigkeit">✦</button><button class="jump" data-control="jump" aria-label="Springen">⬆</button></div></div><div id="layer" class="layer"><div class="panel"><div style="font-size:32px">✦ 🌲 ✦</div><h1 id="heading">REALM RUNNERS</h1><p id="intro">Klassisches Jump ’n’ Run mit RPG-Fortschritt. Drei Waldlevel erwarten dich!</p><div id="menu"><div class="choices" id="classes"><button data-class="warrior">⚔ Krieger</button><button data-class="hunter">🏹 Jäger</button><button data-class="mage">✧ Magier</button></div><div id="progress"></div><div class="levels" id="levels"></div><p class="tip">Weitere Welten: ❄ Frostgipfel · 🌋 Glutberge · ☁ Himmelsruinen (in Entwicklung)</p></div><div class="row"><button class="primary" id="play">Level starten</button><button class="secondary hide" id="return">Zur Weltkarte</button></div><p class="tip" id="help">Windows: A/D oder ←/→ · Leertaste springen · Shift Dash. iPhone: Bildschirmtasten. Querformat empfohlen.</p></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s),canvas=$('#view'),ctx=canvas.getContext('2d'),layer=$('#layer'),hud=$('#hud'),controls=$('#controls');const W=960,H=540,G=465,WIDTH=2800;let scene='menu',stage=0,selected=0,t=0,last=0,cam=0,hero=null,things=[],bad=[],spikes=[],checkpoints=[],particles=[],dashCooldown=0,jumpWas=false,invincible=0;
const stages=[{name:'1-1 · Waldanfang',base:5,gaps:[[510,640],[1120,1280],[1850,2010]],ledges:[[230,356,155],[760,342,155],[1430,355,155],[2180,345,165]],enemies:[460,920,1630,2310],spikes:[1010,1770],checkpoint:1370},{name:'1-2 · Baumkronen',base:8,gaps:[[420,570],[1080,1260],[1760,1960]],ledges:[[230,335,160],[630,315,170],[1330,305,160],[2130,340,150]],enemies:[350,820,1490,2250],spikes:[920,1640,2370],checkpoint:1380},{name:'1-3 · Moosruinen',base:12,gaps:[[530,700],[1190,1360],[1920,2110]],ledges:[[285,340,160],[815,315,175],[1450,335,175],[2220,300,180]],enemies:[430,960,1630,2340],spikes:[1070,1780,2510],checkpoint:1480}];
const classes={warrior:{label:'Krieger',color:'#66aaf0',speed:4.75,jump:13.6},hunter:{label:'Jäger',color:'#90df8b',speed:5.7,jump:13.9},mage:{label:'Magier',color:'#bf9cf1',speed:4.9,jump:14.4}};
let save;try{save=JSON.parse(localStorage.getItem('realm-runners-save-v2')||'null')}catch{}save=save&&typeof save==='object'?save:{class:'warrior',unlocked:1,stars:[0,0,0],xp:0,level:1};save.unlocked=Math.max(1,Math.min(3,Number(save.unlocked)||1));save.stars=Array.isArray(save.stars)?save.stars.slice(0,3):[0,0,0];while(save.stars.length<3)save.stars.push(0);if(!classes[save.class])save.class='warrior';function persist(){try{localStorage.setItem('realm-runners-save-v2',JSON.stringify(save))}catch{}}
const input={left:false,right:false,jump:false,dash:false};const keymap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',ShiftLeft:'dash',ShiftRight:'dash',KeyJ:'dash'};
addEventListener('keydown',e=>{let k=keymap[e.code];if(k){e.preventDefault();input[k]=true}});addEventListener('keyup',e=>{let k=keymap[e.code];if(k){e.preventDefault();input[k]=false}});addEventListener('blur',()=>Object.keys(input).forEach(k=>input[k]=false));document.querySelectorAll('[data-control]').forEach(b=>{const k=b.dataset.control;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);input[k]=true});for(let evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>input[k]=false)});
function size(){let d=Math.min(devicePixelRatio||1,2),s=Math.min(innerWidth/W,innerHeight/H);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d*s,0,0,d*s,(innerWidth-W*s)*d/2,(innerHeight-H*s)*d/2)}addEventListener('resize',size);size();
function menu(){scene='menu';layer.classList.remove('hide');hud.classList.add('hide');controls.classList.add('hide');$('#menu').classList.remove('hide');$('#return').classList.add('hide');$('#heading').textContent='REALM RUNNERS';$('#intro').textContent='Welt 1: Smaragdwald · Schalte Level frei und sammle pro Abschnitt drei Sterne.';$('#play').textContent='Level starten';$('#classes').innerHTML=Object.entries(classes).map(([id,c])=>'<button data-class="'+id+'" class="'+(save.class===id?'active':'')+'">'+({warrior:'⚔',hunter:'🏹',mage:'✧'}[id])+' '+c.label+'</button>').join('');$('#classes').querySelectorAll('button').forEach(b=>b.onclick=()=>{save.class=b.dataset.class;persist();menu()});$('#levels').innerHTML=stages.map((s,i)=>'<button data-level="'+i+'" '+(i>=save.unlocked?'disabled':'')+' class="'+(i===selected?'active':'')+'">'+(i>=save.unlocked?'🔒 ':'')+s.name+'<br>'+'⭐'.repeat(save.stars[i]||0)+'</button>').join('');$('#levels').querySelectorAll('button:not(:disabled)').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.level);menu()});if(selected>=save.unlocked)selected=save.unlocked-1;$('#progress').textContent='Level '+save.level+' · '+save.xp+'/'+save.level*100+' XP · ⭐ '+save.stars.reduce((a,b)=>a+b,0)+'/9';$('#play').onclick=()=>start(selected)}
function land(){let gaps=stages[stage].gaps,ends=[0,...gaps.map(g=>g[1])],begins=[...gaps.map(g=>g[0]),WIDTH];return ends.map((x,i)=>({x,w:begins[i]-x,y:G}))}
function solids(){return [...land(),...stages[stage].ledges.map(a=>({x:a[0],y:a[1],w:a[2]}))]}
function floorY(x){let p=solids().filter(s=>x>=s.x+10&&x<=s.x+s.w-10).sort((a,b)=>b.y-a.y);return p.length?p[0].y:G}
function start(i){stage=i;scene='game';cam=0;dashCooldown=0;jumpWas=false;invincible=0;t=0;hero={x:50,y:300,w:30,h:43,vx:0,vy:0,on:false,face:1,respawn:50,hearts:3,stars:0,earned:0,dash:0,usedDash:false};things=[];bad=[];spikes=stages[i].spikes.map(x=>({x,y:G-18,w:44,h:18}));checkpoints=[{x:stages[i].checkpoint,y:G-70,on:false}];for(let n=0;n<30;n++){let x=125+n*82,y=floorY(x)-42-(n%3)*9;if(solids().some(p=>x>p.x+8&&x<p.x+p.w-8))things.push({x,y,type:'coin',taken:false})}let sx=[340,1475,2400];for(let x of sx)things.push({x,y:floorY(x)-100,type:'star',taken:false});for(let x of stages[i].enemies)bad.push({x,y:G-27,home:x,dir:1,alive:true});layer.classList.add('hide');controls.classList.remove('hide');hud.classList.remove('hide')}
function xp(n){save.xp+=n;while(save.xp>=save.level*100){save.xp-=save.level*100;save.level++}persist()}
function die(){if(invincible>0||hero.dash>0)return;hero.hearts--;invincible=90;if(hero.hearts<=0){end(false);return}hero.x=hero.respawn;hero.y=230;hero.vy=0;cam=Math.max(0,hero.x-300)}
function end(win){if(scene!=='game')return;scene='end';if(win){xp(70+hero.earned);save.stars[stage]=Math.max(save.stars[stage],hero.stars);save.unlocked=Math.max(save.unlocked,Math.min(3,stage+2));persist()}layer.classList.remove('hide');hud.classList.add('hide');controls.classList.add('hide');$('#menu').classList.add('hide');$('#return').classList.remove('hide');$('#return').onclick=menu;$('#heading').textContent=win?'Level geschafft! 🎉':'Versuch es erneut';$('#intro').textContent=win?'Du hast '+hero.stars+'/3 Sterne gesammelt und '+(hero.earned+70)+' XP erhalten.':'Die Sprünge sind knifflig! Nutze den Checkpoint und versuche eine andere Sprungfolge.';$('#play').textContent=win&&stage<2?'Nächstes Level':'Erneut spielen';$('#play').onclick=()=>start(win&&stage<2?stage+1:stage)}
function step(dt){if(scene!=='game')return;t+=dt;let h=hero,cl=classes[save.class],movement=(input.right?1:0)-(input.left?1:0);if(movement)h.face=movement;h.vx=movement*cl.speed;if(input.jump&&!jumpWas&&h.on){h.vy=-cl.jump;h.on=false}jumpWas=input.jump;if(input.dash&&!h.usedDash&&dashCooldown<=0){h.dash=12;dashCooldown=70;h.usedDash=true}if(h.dash>0){h.vx=h.face*11.7;h.vy=0;h.dash-=dt}else h.vy=Math.min(18,h.vy+.63*dt);let prevY=h.y;h.x=Math.max(0,Math.min(WIDTH-30,h.x+h.vx*dt));h.y+=h.vy*dt;h.on=false;for(let p of solids())if(h.x+h.w>p.x&&h.x<p.x+p.w&&prevY+h.h<=p.y+9&&h.y+h.h>=p.y&&h.vy>=0){h.y=p.y-h.h;h.vy=0;h.on=true;h.usedDash=false}for(let a of things)if(!a.taken&&Math.hypot(a.x-h.x-15,a.y-h.y-20)<30){a.taken=true;if(a.type==='star'){h.stars++;h.earned+=25}else h.earned+=5}for(let e of bad)if(e.alive){e.x+=e.dir*.8*dt;if(Math.abs(e.x-e.home)>42)e.dir*=-1;if(h.x<e.x+27&&h.x+h.w>e.x&&h.y<e.y+27&&h.y+h.h>e.y){if(h.vy>1&&prevY+h.h<e.y+14){e.alive=false;h.vy=-9;h.earned+=15}else if(h.dash>0){e.alive=false;h.earned+=10}else die()}}for(let s of spikes)if(h.x+h.w>s.x+3&&h.x<s.x+s.w-3&&h.y+h.h>s.y+8&&h.y<s.y+s.h)die();for(let cp of checkpoints)if(h.x>cp.x&&!cp.on){cp.on=true;h.respawn=cp.x;h.hearts=Math.min(3,h.hearts+1)}if(h.y>H+110){h.x=h.respawn;h.y=260;h.vy=0;die()}if(h.x>WIDTH-85)end(true);invincible=Math.max(0,invincible-dt);dashCooldown=Math.max(0,dashCooldown-dt);cam=Math.max(0,Math.min(WIDTH-W,h.x-350));$('#hudLeft').textContent='❤️ '+h.hearts+'  ⭐ '+h.stars+'/3  🪙 '+Math.round(h.earned/5);$('#hudRight').textContent=stages[stage].name+' · '+cl.label}
function box(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function draw(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#142749');g.addColorStop(1,'#568e92');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let layerIndex=0;layerIndex<4;layerIndex++){ctx.fillStyle=['#31596f','#336d76','#437e75','#447e64'][layerIndex];ctx.globalAlpha=.15+layerIndex*.15;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+35;x+=20)ctx.lineTo(x,280+layerIndex*43+Math.sin((x+cam*(.08+layerIndex*.11))/93)*36);ctx.lineTo(W,H);ctx.fill()}ctx.globalAlpha=1;ctx.save();ctx.translate(-cam,0);for(let p of solids()){box(p.x,p.y,p.w,H-p.y,'#2e574b');box(p.x,p.y,p.w,11,'#87c891');for(let x=p.x+10;x<p.x+p.w;x+=46){ctx.fillStyle='#75a981';ctx.beginPath();ctx.arc(x,p.y+9,7,0,7);ctx.fill()}}for(let s of spikes){ctx.fillStyle='#e4c1be';for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(s.x+k*15,s.y+18);ctx.lineTo(s.x+8+k*15,s.y);ctx.lineTo(s.x+15+k*15,s.y+18);ctx.fill()}}for(let a of things)if(!a.taken){let y=a.y+Math.sin(t*.045+a.x)*3;ctx.fillStyle=a.type==='star'?'#fff4a2':'#ffcd67';ctx.beginPath();if(a.type==='star'){for(let j=0;j<10;j++){let an=(j*Math.PI/5)-Math.PI/2,r=j%2?8:18;ctx.lineTo(a.x+Math.cos(an)*r,y+Math.sin(an)*r)}}else ctx.arc(a.x,y,9,0,7);ctx.fill()}for(let e of bad)if(e.alive){ctx.fillStyle='#f08da4';ctx.beginPath();ctx.ellipse(e.x+13,e.y+14,14,15,0,0,7);ctx.fill();box(e.x+7,e.y+10,4,4,'#18284b');box(e.x+19,e.y+10,4,4,'#18284b')}for(let cp of checkpoints){box(cp.x,385,5,80,'#b9ddde');ctx.fillStyle=cp.on?'#b0fa9a':'#d5abf8';ctx.beginPath();ctx.moveTo(cp.x+5,386);ctx.lineTo(cp.x+57,408);ctx.lineTo(cp.x+5,429);ctx.fill()}box(WIDTH-77,340,5,125,'#fcf1a4');ctx.fillStyle='#f3bd6d';ctx.beginPath();ctx.moveTo(WIDTH-72,341);ctx.lineTo(WIDTH-16,361);ctx.lineTo(WIDTH-72,384);ctx.fill();if(hero&&!(invincible&&Math.floor(invincible/6)%2)){const h=hero;box(h.x+4,h.y+13,23,29,classes[save.class].color);ctx.fillStyle='#ffdabb';ctx.beginPath();ctx.arc(h.x+15,h.y+11,11,0,7);ctx.fill();box(h.x+(h.face===1?19:7),h.y+8,4,4,'#1e3655');box(h.x+5,h.y+41,8,6,'#1b2c43');box(h.x+20,h.y+41,8,6,'#1b2c43');if(h.dash>0){ctx.strokeStyle='#e3efff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(h.x-h.face*36,h.y+24);ctx.lineTo(h.x+15,h.y+24);ctx.stroke()}}ctx.restore();ctx.fillStyle='#ffffffad';ctx.textAlign='center';ctx.font='bold 14px system-ui';ctx.fillText('★ Drei Sterne versteckt · Gegner von oben treffen · Ziel: Flagge',W/2,55)}
function frame(now){let dt=Math.min(2,(now-last)/16.667||1);last=now;step(dt);draw();requestAnimationFrame(frame)}menu();requestAnimationFrame(frame);
</script></body></html>
