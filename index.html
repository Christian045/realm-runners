<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101c38"><title>Realm Runners</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1830;color:white;font-family:system-ui;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh}.hud{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;text-shadow:0 1px 2px #000}.hud span{padding:9px 12px;border-radius:20px;background:#142344ca;font-weight:700;font-size:13px}.buttons{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.group{display:flex;gap:12px}.buttons button{pointer-events:auto;width:clamp(58px,16vw,80px);height:clamp(58px,16vw,80px);border-radius:18px;border:1px solid #a5bce4;color:#fff;background:#284d9cb8;font-size:24px;touch-action:none}.buttons button.attack{background:#6651b5bc}.overlay{position:absolute;inset:0;background:#08142adf;display:grid;place-items:center;padding:18px}.panel{max-width:500px;padding:28px 22px;border:1px solid #647caa;border-radius:22px;background:linear-gradient(140deg,#273e67,#111d3b);text-align:center}.panel h1{margin:4px 0 8px;font-size:clamp(27px,7vw,42px)}.panel p{color:#c0d0eb;line-height:1.5}.options{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0}.options button,.start{border:1px solid #8da9e1;border-radius:12px;background:#304d83;color:white;padding:12px 15px;font-weight:700}.options .selected,.start{background:#507ee4}.hint{font-size:12px}.hidden{display:none}@media(min-width:900px){.buttons{opacity:.6}}
</style></head><body><canvas id="game"></canvas><div class="hud hidden" id="hud"><span id="stats"></span><span id="zone"></span></div><div id="buttons" class="buttons hidden"><div class="group"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="group"><button class="attack" data-key="attack">⚔</button><button data-key="jump">⬆</button></div></div><div class="overlay" id="overlay"><div class="panel"><div style="font-size:35px">✦ 🏰 ✦</div><h1 id="title">REALM RUNNERS</h1><p id="description">Ein erster spielbarer Action-Platformer: Wähle deine Klasse, sammle XP und bezwinge zwei Level!</p><div class="options" id="options"><button data-class="warrior" class="selected">⚔ Krieger</button><button data-class="hunter">🏹 Jäger</button><button data-class="mage">✧ Magier</button></div><button class="start" id="start">Spielen</button><p class="hint">Windows: A/D bewegen · Leertaste springen · J angreifen. iPhone: Bildschirmtasten. Querformat empfohlen.</p></div></div><script>
const canvas=document.querySelector('#game'),c=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),buttons=document.querySelector('#buttons'),hud=document.querySelector('#hud'),stats=document.querySelector('#stats'),zone=document.querySelector('#zone'),title=document.querySelector('#title'),description=document.querySelector('#description'),start=document.querySelector('#start'),options=document.querySelector('#options');let chosen='warrior',active=false,stage=0,level=1,xp=0,kills=0,cam=0,last=0,invuln=0,shield=0,speed=0,cooldown=0,slash=0;let player,coins,enemies,powers,stars=[];const keys={left:false,right:false,jump:false,attack:false};let heldJump=false;const W=960,H=540,L=2600;const themes=[{name:'Zauberwald',sky:'#19365d',light:'#72b8b0',ground:'#385e55',grass:'#80cd94',hill:'#4d7e91'},{name:'Kristallhöhle',sky:'#241b4d',light:'#866dae',ground:'#4c4074',grass:'#bc9bfa',hill:'#635185'}];const floors=[[{x:0,w:560},{x:650,w:460},{x:1200,w:420},{x:1710,w:890}],[{x:0,w:480},{x:580,w:450},{x:1140,w:510},{x:1730,w:870}]];const ledges=[[{x:230,y:365,w:150},{x:760,y:350,w:165},{x:1310,y:355,w:150},{x:1980,y:350,w:155}],[{x:170,y:365,w:160},{x:680,y:345,w:160},{x:1250,y:340,w:170},{x:2010,y:340,w:170}]];function resize(){let d=Math.min(devicePixelRatio||1,2),sc=Math.min(innerWidth/W,innerHeight/H);canvas.width=innerWidth*d;canvas.height=innerHeight*d;c.setTransform(d*sc,0,0,d*sc,(innerWidth-W*sc)*d/2,(innerHeight-H*sc)*d/2)}addEventListener('resize',resize);resize();function platforms(){return [...floors[stage].map(p=>({...p,y:455})),...ledges[stage]]}function init(){player={x:60,y:380,w:30,h:48,vx:0,vy:0,on:false,face:1,hp:3};coins=[];enemies=[];powers=[];cam=0;invuln=0;shield=0;speed=0;for(let i=0;i<21;i++){let x=155+i*110,p=platforms().find(p=>x>p.x+10&&x<p.x+p.w-10);if(p)coins.push({x,y:p.y-36-(i%2)*20,got:false})}for(let i=0;i<7;i++){let x=350+i*305,p=platforms().find(p=>x>p.x+20&&x<p.x+p.w-20);if(p)enemies.push({x,y:p.y-30,home:x,dir:1,alive:true})}for(let x of [810,1350,2080]){let p=platforms().find(p=>x>p.x&&x<p.x+p.w);if(p)powers.push({x,y:p.y-65,kind:x===1350?'speed':'shield',got:false})}zone.textContent=(stage+1)+' / 2 · '+themes[stage].name}function show(t,d,b){active=false;title.textContent=t;description.textContent=d;start.textContent=b;overlay.classList.remove('hidden');buttons.classList.add('hidden');hud.classList.add('hidden')}function begin(){active=true;stage=0;xp=0;level=1;kills=0;init();overlay.classList.add('hidden');buttons.classList.remove('hidden');hud.classList.remove('hidden');start.textContent='Spielen'}start.onclick=begin;document.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{chosen=b.dataset.class;document.querySelectorAll('[data-class]').forEach(v=>v.classList.toggle('selected',b===v))});function gain(n){xp+=n;while(xp>=level*100){xp-=level*100;level++;player.hp=Math.min(5,player.hp+1)}}function hurt(){if(shield||invuln)return;player.hp--;invuln=70;if(player.hp<=0)show('Game Over','Dein Charakter wurde besiegt. Versuche es erneut!','Neustart')}function tick(dt){if(!active)return;let p=player;p.vx=((keys.right?1:0)-(keys.left?1:0))*(chosen==='hunter'?6:5)* (speed?1.5:1);if(p.vx)p.face=Math.sign(p.vx);if(keys.jump&&!heldJump&&p.on){p.vy=-14;p.on=false}heldJump=keys.jump;let old=p.y;p.vy+=.67*dt;p.x=Math.max(0,Math.min(L-p.w,p.x+p.vx*dt));p.y+=p.vy*dt;p.on=false;for(let q of platforms())if(p.x+p.w>q.x&&p.x<q.x+q.w&&old+p.h<=q.y+8&&p.y+p.h>=q.y&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.on=true}if(p.y>580){p.x=60;p.y=320;p.vy=0;hurt()}if(keys.attack&&cooldown<=0){cooldown=chosen==='warrior'?19:27;slash=12;let reach=chosen==='mage'?130:chosen==='hunter'?110:70;for(let e of enemies)if(e.alive&&Math.abs(e.x-p.x)<reach&&Math.abs(e.y-p.y)<58&&(e.x-p.x)*p.face>=-10){e.alive=false;gain(35);kills++}}for(let q of coins)if(!q.got&&Math.hypot(q.x-p.x-15,q.y-p.y-20)<35){q.got=true;gain(20)}for(let q of powers)if(!q.got&&Math.hypot(q.x-p.x-15,q.y-p.y-20)<42){q.got=true;if(q.kind==='shield')shield=600;else speed=500}for(let e of enemies)if(e.alive){e.x+=e.dir*.7*dt;if(Math.abs(e.x-e.home)>35)e.dir*=-1;if(p.x<e.x+28&&p.x+p.w>e.x&&p.y<e.y+30&&p.y+p.h>e.y)hurt()}cooldown=Math.max(0,cooldown-dt);slash=Math.max(0,slash-dt);shield=Math.max(0,shield-dt);speed=Math.max(0,speed-dt);invuln=Math.max(0,invuln-dt);if(p.x>L-105){if(stage===0){stage=1;init()}else show('Demo abgeschlossen!','Du hast beide Welten geschafft, '+kills+' Gegner besiegt und Level '+level+' erreicht!','Nochmal spielen')}cam=Math.min(L-W,Math.max(0,p.x-W*.35));stats.textContent='Lv '+level+' · XP '+xp+'/'+(level*100)+' · ❤️ '+p.hp}function rect(x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}function render(){let t=themes[stage],g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,t.sky);g.addColorStop(1,t.light);c.fillStyle=g;c.fillRect(0,0,W,H);for(let i=0;i<3;i++){c.fillStyle=t.hill;c.globalAlpha=.15+i*.12;c.beginPath();c.moveTo(0,H);for(let x=0;x<=W+40;x+=25)c.lineTo(x,270+i*60+Math.sin((x+cam*(.09+i*.15))/110)*35);c.lineTo(W,H);c.fill()}c.globalAlpha=1;c.save();c.translate(-cam,0);for(let q of platforms()){rect(q.x,q.y,q.w,H-q.y,t.ground);rect(q.x,q.y,q.w,9,t.grass)}for(let q of coins)if(!q.got){c.beginPath();c.fillStyle='#ffe18c';c.arc(q.x,q.y,10,0,Math.PI*2);c.fill()}for(let q of powers)if(!q.got){c.beginPath();c.fillStyle=q.kind==='shield'?'#a5ecff':'#ffd48d';c.arc(q.x,q.y,17,0,Math.PI*2);c.fill();c.fillStyle='#193659';c.textAlign='center';c.font='bold 17px sans-serif';c.fillText(q.kind==='shield'?'◆':'⚡',q.x,q.y+6)}for(let e of enemies)if(e.alive){c.fillStyle='#e98cae';c.beginPath();c.ellipse(e.x+14,e.y+16,16,15,0,0,7);c.fill();rect(e.x+8,e.y+12,4,4,'#23334c');rect(e.x+19,e.y+12,4,4,'#23334c')}let p=player;if(p&&!(invuln&&Math.floor(invuln/5)%2===0)){rect(p.x+3,p.y+14,25,31,chosen==='warrior'?'#75b8ff':chosen==='hunter'?'#9fe3a1':'#cca1ff');c.beginPath();c.fillStyle='#ffdab9';c.arc(p.x+15,p.y+12,12,0,7);c.fill();rect(p.x+(p.face>0?20:7),p.y+10,4,4,'#1c2d45');rect(p.x+5,p.y+43,7,6,'#182a49');rect(p.x+20,p.y+43,7,6,'#182a49');if(shield){c.strokeStyle='#9cddff';c.lineWidth=3;c.beginPath();c.arc(p.x+15,p.y+24,35,0,7);c.stroke()}if(slash){c.strokeStyle='#fff2aa';c.lineWidth=6;c.beginPath();c.arc(p.x+15,p.y+20,chosen==='mage'?100:chosen==='hunter'?80:46,p.face>0?-.8:2.3,p.face>0?.8:3.9);c.stroke()}}rect(L-65,347,6,108,'#fff0ad');c.fillStyle='#daa8fc';c.beginPath();c.moveTo(L-59,348);c.lineTo(L-8,371);c.lineTo(L-59,395);c.fill();c.restore();c.textAlign='center';c.font='bold 15px sans-serif';c.fillStyle='#fff';c.fillText('XP sammeln · Gegner besiegen · Flagge erreichen →',W/2,42);if(shield||speed)c.fillText((shield?'◆ Schild ':'')+(speed?'⚡ Tempo':''),W/2,66)}function loop(time){let dt=Math.min((time-last)/16.67||1,2);last=time;tick(dt);render();requestAnimationFrame(loop)}init();requestAnimationFrame(loop);const map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyJ:'attack',KeyK:'attack'};addEventListener('keydown',e=>{let k=map[e.code];if(k){e.preventDefault();keys[k]=true}});addEventListener('keyup',e=>{let k=map[e.code];if(k){e.preventDefault();keys[k]=false}});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});for(let event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys[k]=false)});addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));
</script></body></html>
